title: Omar Garib
description: Reliable Embodied AI · Safety-Critical Autonomy · Vision-Language-Action · Human-Robot Interaction
url: https://omargarib02.github.io
lang: en
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: "contrast"
plugins:
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false

# ---------- Sidebar Settings ----------
author:
  name: Omar Garib
  avatar: /assets/img/headshot.jpg
  bio: "Graduate Researcher in Computational Science & Engineering at Georgia Tech (ASDL)."
  links:
    - label: GitHub
      icon: fab fa-github
      url: https://github.com/omargarib02
    - label: LinkedIn
      icon: fab fa-linkedin
      url: https://www.linkedin.com/in/omargarib/
    - label: Email
      icon: fas fa-envelope
      url: mailto:ogarib@gatech.edu

# ---------- Layout Defaults ----------
defaults:
  - scope:
      path: ""
    values:
      layout: single
      toc: false
      author_profile: true
      comments: false

  - scope:
      path: ""
      type: pages
    values:
      author_profile: true

timezone: America/New_York